
name: MR POYA AI - Daily Content Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          mkdir -p output

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          PROMPT=$(cat <<'EOF'
          You are the professional documentary scriptwriter
          for MR POYA AI, a worldwide English YouTube channel.

          Choose one fascinating topic from:
          Science & Hidden World, Human Psychology, Space & Universe,
          Future Technology, Ancient History, Human Body Science.

          Create an original 3-5 minute English documentary draft.

          Include:
          1. Powerful 5-second hook.
          2. Interesting title.
          3. Full narration in simple natural English.
          4. 8-12 cinematic visual scenes.
          5. Image generation prompt for each scene.
          6. Camera movement and transition instructions.
          7. Suggested thumbnail text.
          8. Three Shorts ideas from the same topic.
          9. Research notes and reliable source links to verify.

          Do not invent facts, statistics, quotes or source URLs.
          Clearly mark claims that need fact-checking.
          Make content original, educational and engaging.
          Return the result in clean Markdown.
          EOF
          )

          jq -n --arg prompt "$PROMPT" \
            '{
              contents: [{parts: [{text: $prompt}]}],
              generationConfig: {
                temperature: 0.8,
                maxOutputTokens: 8192
              }
            }' > request.json

          echo "Connecting to Gemini API..."

          if ! HTTP_STATUS=$(curl -sS \
            --retry 5 \
            --retry-all-errors \
            --retry-max-time 180 \
            -o response.json \
            -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json); then

            echo "ERROR: Gemini connection failed."
            cat response.json || true
            exit 1
          fi

          echo "Gemini HTTP Status: $HTTP_STATUS"

          if [[ ! "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "ERROR: Gemini API returned an error."
            cat response.json
            exit 1
          fi

          echo "Checking Gemini response..."

          jq -r '[.candidates[]?.content.parts[]?.text // empty] | join("\n")' \
            response.json > output/latest-script.md

          if [ ! -s output/latest-script.md ]; then
            echo "ERROR: Gemini returned an empty response."
            cat response.json
            exit 1
          fi

          echo "Content generated successfully."

          rm -f request.json response.json

            - name: Save generated content
        run: |
          git config user.name "MR POYA AI"
          git config user.email "actions@github.com"

          git add output/latest-script.md

          if git diff --cached --quiet; then
            echo "No new changes to save."
          else
            git commit -m "Generate daily AI content"
            git pull --rebase origin main
            git push origin main
          fi
